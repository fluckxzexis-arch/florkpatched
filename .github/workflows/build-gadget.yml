name: build-gadget

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - name: Clone frida
        run: |
          git clone --recurse-submodules --branch 16.7.18 --depth 1 https://github.com/frida/frida.git
          cd frida
          python3 tools/ensure-submodules.py
      - name: Find gadget config source
        run: |
          cd frida
          find . -name 'config.c' | head -10 || true
          find . -iname '*gadget*' -maxdepth 4 | head -20 || true
          ls subprojects/ | head -10 || true
      - name: Drop frida-python subproject
        run: |
          cd frida
          git submodule deinit -f subprojects/frida-python || true
          rm -rf subprojects/frida-python
          git submodule deinit -f subprojects/frida-node || true
          rm -rf subprojects/frida-node
      - name: Configure + build gadget
        run: |
          cd frida
          ./configure --enable-gadget --disable-server --disable-frida-tools
          make -j2
          find . -name "frida-gadget*" -not -path "./subprojects/*" | head -5
      - name: Upload gadget
        uses: actions/upload-artifact@v4
        with:
          name: custom-gadget
          path: |
            frida/**/frida-gadget*.dylib
          if-no-files-found: warn
