name: Build custom frida-gadget (iOS arm64, embedded script)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - name: Clone frida
        run: |
          git clone --recurse-submodules --branch 16.7.18 --depth 1 https://github.com/frida/frida.git
          cd frida
          python3 tools/ensure-submodules.py
      - name: Patch gadget default config
        run: |
          cd frida
          F=$(find . -path '*gadget*config*.c' | grep -v test | head -1)
          echo "config source: $F"
          if [ -n "$F" ]; then
            grep -n "127.0.0.1" "$F" | head -3
            python3 - "$F" <<'PYEOF'
import sys
p = sys.argv[1]
s = open(p).read()
old = 'g_strdup ("127.0.0.1")'
if old in s:
    s = s.replace(old, 'g_strdup ("0.0.0.0")')
    open(p, 'w').write(s)
    print("patched address default")
PYEOF
          fi
      - name: Install deps
        run: |
          cd frida
          python3 releng/deps.py
      - name: Configure + build gadget (iOS arm64)
        run: |
          cd frida
          export SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          ./configure --enable-gadget --disable-server --disable-portal --disable-inject --disable-frida-tools --host=ios-arm64
          make -j2
          find . -name "frida-gadget*.dylib" | head -5
      - name: Upload gadget
        uses: actions/upload-artifact@v4
        with:
          name: custom-gadget
          path: |
            frida/**/frida-gadget*.dylib
          if-no-files-found: warn
