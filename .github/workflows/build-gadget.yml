name: build-gadget

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - name: Clone frida
        run: |
          git clone --recurse-submodules --branch 16.7.18 --depth 1 https://github.com/frida/frida.git
          cd frida
          python3 tools/ensure-submodules.py
      - name: Find gadget config source
        run: |
          cd frida
          find . -name 'config.c' | head -10 || true
          find . -iname '*gadget*' -maxdepth 4 | head -20 || true
          ls subprojects/ | head -10 || true
      - name: Use python 3.12 (override)
        run: |
          brew install python@3.12 2>&1 | tail -1 || true
          P12="$(brew --prefix)/opt/python@3.12/bin/python3.12"
          ln -sf "$P12" /opt/homebrew/bin/python3
          ln -sf "$P12" /usr/local/bin/python3 2>/dev/null || true
          python3 --version
      - name: Patch meson (drop frida-python subproject)
        run: |
          cd frida
          sed -i.bak "/frida-python/d" meson.build
          grep -n "frida-python" meson.build || echo "python subproject removed"
      - name: Configure + build gadget
        run: |
          cd frida
          export MACOS_CERTID="-"
          ./configure --enable-gadget --disable-server --disable-frida-tools
          make -j2
          find . -name "frida-gadget*" -not -path "./subprojects/*" | head -5
      - name: Upload gadget
        uses: actions/upload-artifact@v4
        with:
          name: custom-gadget
          path: |
            frida/**/frida-gadget*.dylib
          if-no-files-found: warn
